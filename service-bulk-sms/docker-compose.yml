version: "2"
services:
  # The php-fpm service for silicon sms
  php:
    build:
      context: .
      dockerfile: ./docker/php/Dockerfile
    image: silicon/silicon-sms-php
    volumes:
      - ".:/app"
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: homestead
      MYSQL_USER: homestead
      MYSQL_PASSWORD: secret
      COMPOSER_MEMORY_LIMIT: -1
    container_name: silicon-sms-php
    networks:
      - footfall

  # The Nginx service for silicon
  nginx:
    build:
      context: .
      dockerfile: ./docker/nginx/Dockerfile
    image: silicon/silicon-sms-nginx
    volumes:
      - ".:/app"
    ports:
      - "8081:80"
    container_name: silicon-sms-nginx
    depends_on:
      - php
    networks:
      - footfall

  # The MySql service for silicon
  mysql:
    image: "mysql:5.7"
    ports:
      - "3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: homestead
      MYSQL_USER: homestead
      MYSQL_PASSWORD: secret
    volumes:
      - "mysqldata:/var/lib/mysql"
    container_name: silicon-sms-mysql
    networks:
      - footfall

  worker:
    entrypoint: sh -c "php artisan queue:work"
    image: silicon/silicon-sms-php
    volumes:
      - '.:/app'
    container_name: silicon-sms-worker
    networks:
      - footfall
    depends_on:
      - php

  # RabbitMQ broker for the SMPP pipeline (SMS outbound + DLR queues).
  # Host ports use 5673/15673 to avoid clashing with the host's own RabbitMQ (5672/15672).
  # Inside the footfall network the app connects to  rabbitmq:5672  (container name, internal port).
  rabbitmq:
    image: "rabbitmq:3.13-management"
    ports:
      - "5673:5672"     # AMQP  (host:container)
      - "15673:15672"   # Management UI → http://localhost:15673  (guest/guest)
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - "rabbitmqdata:/var/lib/rabbitmq"
    container_name: silicon-sms-rabbitmq
    networks:
      - footfall

volumes:
  mysqldata:
    driver: local
  rabbitmqdata:
    driver: local

# Networks
networks:
  footfall:
    external: true
