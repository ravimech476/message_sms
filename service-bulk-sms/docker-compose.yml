version: "2"
services:
  # The php-fpm service for silicon sms
  php:
    build:
      context: .
      dockerfile: ./docker/php/Dockerfile
    image: silicon/silicon-sms-php
    volumes:
      - ".:/app"
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: homestead
      MYSQL_USER: homestead
      MYSQL_PASSWORD: secret
      COMPOSER_MEMORY_LIMIT: -1
    container_name: silicon-sms-php
    networks:
      - footfall

  # The Nginx service for silicon
  nginx:
    build:
      context: .
      dockerfile: ./docker/nginx/Dockerfile
    image: silicon/silicon-sms-nginx
    volumes:
      - ".:/app"
    ports:
      - "8081:80"
    container_name: silicon-sms-nginx
    depends_on:
      - php
    networks:
      - footfall

  # The MySql service for silicon
  mysql:
    image: "mysql:5.7"
    ports:
      - "3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: homestead
      MYSQL_USER: homestead
      MYSQL_PASSWORD: secret
    volumes:
      - "mysqldata:/var/lib/mysql"
    container_name: silicon-sms-mysql
    networks:
      - footfall

  worker:
    entrypoint: sh -c "php artisan queue:work"
    image: silicon/silicon-sms-php
    volumes:
      - '.:/app'
    container_name: silicon-sms-worker
    networks:
      - footfall
    depends_on:
      - php

volumes:
  mysqldata:
    driver: local

# Networks
networks:
  footfall:
    external: true
