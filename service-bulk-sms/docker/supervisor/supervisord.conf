; Main supervisord config for the FootFall SMPP binder fleet.
; Loaded by the `smpp-workers` docker-compose service. Runs in the foreground
; (nodaemon) so the container stays alive; supervisor autorestarts each worker.
[supervisord]
nodaemon=true
logfile=/app/storage/logs/supervisord.log
pidfile=/tmp/supervisord.pid
user=root
loglevel=info

; Let `supervisorctl status` work inside the container.
[unix_http_server]
file=/tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

; The 5 senders + 10 DLR receiver banks + DLR buffer processor.
[include]
files = /app/docker/supervisor/sms-workers.conf
