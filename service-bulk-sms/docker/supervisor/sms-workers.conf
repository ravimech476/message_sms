; ── Group so you can control all workers at once ─────────────────────────────
;   supervisorctl start footfall-sms:*   /   stop footfall-sms:*
[group:footfall-sms]
programs=footfall-smpp-consume,footfall-dlr-process-buffer,footfall-smpp-dlr-bank-a0,footfall-smpp-dlr-bank-b0,footfall-smpp-dlr-bank-c0,footfall-smpp-dlr-bank-d0,footfall-smpp-dlr-bank-e0,footfall-smpp-dlr-bank-f0,footfall-smpp-dlr-bank-g0,footfall-smpp-dlr-bank-h0,footfall-smpp-dlr-bank-i0,footfall-smpp-dlr-bank-j0
