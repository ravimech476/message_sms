; ============================================================================
; FootFall SMS workers — supervisor config (mirrors sms_expert's laravel-rabbitmq.conf)
;
; Bind budget on the Vonage account (SMPP_SYSTEM_ID) = 15 total:
;   • SENDING   = 5  transmitter binds   → [program:footfall-smpp-consume] numprocs=5
;   • RECEIVING = 10 receiver binds      → [program:footfall-smpp-dlr-bank-a0 .. j0]
;   • dlr-process-buffer opens NO bind (pure DB) — not counted.
;
; Paths assume the FootFall container layout: app at /app, php = /usr/bin/php,
; user root. Adjust the two paths + user if you deploy on a bare host.
;
; ── Install (inside the container or on the host) ───────────────────────────
;   apk add supervisor            # Alpine  (or: apt-get install supervisor)
;   cp docker/supervisor/sms-workers.conf /etc/supervisor/conf.d/
;   supervisord -c /etc/supervisor/supervisord.conf     # first run
;   supervisorctl reread && supervisorctl update
;   supervisorctl start footfall-sms:*                  # start the whole group
;
; ── ⚠ Before enabling all 15 ────────────────────────────────────────────────
;   Confirm the Vonage account allows ≥15 concurrent binds. If not, either lower
;   the sender numprocs and/or set some banks autostart=false, OR switch to the
;   TRANSCEIVER model (SMPP_PERSISTENT_SEND=true) which production ultimately
;   adopted: the 10 banks then SEND *and* RECEIVE on one session (10 binds total,
;   no separate senders) and avoid the ~5% DLR loss the split model can have.
;   To use that model: set the senders below autostart=false and flip the .env flag.
; ============================================================================

; ── SENDING: 5 transmitter workers (RabbitMQ auto-balances sms.outbound) ─────
[program:footfall-smpp-consume]
command=/bin/sh -c 'exec php /app/artisan smpp:consume >> /app/storage/logs/smpp-consume-%(process_num)02d.log 2>&1'
process_name=%(program_name)s_%(process_num)02d
numprocs=5
autostart=true
autorestart=true
user=root
stdout_logfile=/dev/null
stopwaitsecs=30

; ── DLR BUFFER PROCESSOR: matches buffered DLRs → smsg_log (NO bind, run ONE) ─
[program:footfall-dlr-process-buffer]
command=/bin/sh -c 'exec php /app/artisan dlr:process-buffer --continuous --limit=200 --sleep=2 >> /app/storage/logs/dlr-process-buffer.log 2>&1'
numprocs=1
autostart=true
autorestart=true
user=root
stdout_logfile=/dev/null
stopwaitsecs=30

; ── RECEIVING: 10 DLR receiver banks (a0 .. j0), one bind each ───────────────
[program:footfall-smpp-dlr-bank-a0]
command=/bin/sh -c 'exec php /app/artisan smpp:dlr-receiver --bank=a0 >> /app/storage/logs/smpp-dlr-bank-a0.log 2>&1'
numprocs=1
autostart=true
autorestart=true
user=root
stdout_logfile=/dev/null
stopwaitsecs=60

