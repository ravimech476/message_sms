[program:sms-queue-processor]
process_name=%(program_name)s_%(process_num)02d
command=php /path/to/your/project/artisan sms:process-queue --queue=sms.outbound --prefetch=5
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/supervisor/sms-queue-processor.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=10
stopwaitsecs=3600
stopsignal=TERM

[program:sms-priority-processor]
process_name=%(program_name)s_%(process_num)02d
command=php /path/to/your/project/artisan sms:process-queue --queue=sms.priority --prefetch=3
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/supervisor/sms-priority-processor.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=10
stopwaitsecs=3600
stopsignal=TERM

[program:sms-dlr-processor]
process_name=%(program_name)s_%(process_num)02d
command=php /path/to/your/project/artisan sms:process-dlr
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/supervisor/sms-dlr-processor.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=10
stopwaitsecs=3600
stopsignal=TERM

[group:sms]
programs=sms-queue-processor,sms-priority-processor,sms-dlr-processor
priority=999
