; ============================================================================
; SMPP DLR Multi-Bank Receivers (one transceiver bind per bank, partitioned
; seq_id range). Mirrors OLD SYSTEM architecture — see config/smpp_banks.php.
;
; REQUIREMENT: Vonage must have multi-bind / concurrent-session mode enabled
; on the SMPP account before you switch autostart=true. Without it, every
; bank past the first will be rejected with ESME_RALYBND and supervisor will
; restart-loop them.
;
; To enable: confirm with Vonage, set SMPP_BANKS_ENABLED=true in .env,
; flip autostart=true below (or just `supervisorctl start <group>`), then
; supervisorctl reread && supervisorctl update.
; ============================================================================

[program:sms-expert-smpp-dlr-bank-a0]
process_name=%(program_name)s
command=php /var/www/sms_expert_new-BE/artisan smpp:dlr-receiver --bank=a0
autostart=false
autorestart=true
user=www-data
numprocs=1
redirect_stderr=true
