; ----------------------------------------------------------------------------
; Vonage TRANSCEIVER banks (a0..j0) — ALL ENABLED, SEND + RECEIVE on one session.
; REQUIRES .env: SMPP_PERSISTENT_SEND=true  → each bank drains sms.outbound, SUBMITs on its OWN
; bound session, and receives that message's DLR back on the SAME session (Vonage returns a DLR to
; the submitting session). This is the SMPP-ONLY, no-Reports-API model — the same as the OLD system.
; It eliminates the ~5.5% DLR loss the split model had (transmitter senders + separate receivers,
; where Vonage did not always route the DLR to a receiver-only bank). DLRs buffer to
; smsg_receipt_buffer_new (DLR_USE_BUFFER=true) → dlr_process_buffer applies them.
;
; ⚠ BIND MATH: 10 transceiver banks = 10 binds on c980a5f2 (the separate sms_process_queue senders
;   are now OFF, so NOT 15). Local proved 11 binds work, so 10 is safe. If the account cap is lower,
;   set some banks back to autostart=false (fewer banks = lower send throughput, DLRs still fine).
;
; ROLLOUT ORDER (SMPP-only, no Reports API):
;   1. .env: SMPP_PERSISTENT_SEND=true ; php artisan config:clear
;   2. supervisorctl update ; the banks now SEND+RECEIVE. sms_process_queue is autostart=false.
;   3. Confirm: each bank binds as transceiver (no ESME_RALYBND), messages still go out (submit_sm
;      in smpp-dlr-bank-*.log), AND deliver_sm DLRs arrive on the SAME bank → buffer fills →
;      deliverystatus2 updates. The un-updated count should go to ~0.
;   4. Reports-API programs (nexmo_process-delivery-queue, reports-consume, nexmo:fetch-* crons)
;      stay OFF — no longer needed, no billing.
; ----------------------------------------------------------------------------
[program:sms-expert-smpp-dlr-bank-a0]
command=/bin/bash -c 'LOGDIR=/home/smsexpert/public_html/sms_expert/storage/logs/$(date +%%Y-%%m-%%d); mkdir -p "$LOGDIR"; exec php /home/smsexpert/public_html/sms_expert/artisan smpp:dlr-receiver --bank=a0 >> "$LOGDIR/smpp-dlr-bank-a0.log" 2>&1'
