; ============================================================================
; DATE-WISE LOGGING
; ----------------------------------------------------------------------------
; supervisor's `stdout_logfile` is a STATIC path — it cannot expand a date.
; So every program below wraps its artisan call in a tiny shell that:
;     LOGDIR=<...>/storage/logs/$(date +%%Y-%%m-%%d)   # e.g. .../logs/2026-07-16
;     mkdir -p "$LOGDIR"
;     exec php artisan <cmd> >> "$LOGDIR/<worker>.log" 2>&1
;
;   * `exec` replaces the shell with php so supervisor's stop signals reach php
;     directly (graceful stopwaitsecs shutdown still works).
;   * `%%Y-%%m-%%d` -> supervisor emits a literal `%Y-%m-%d` for `date`.
;   * `%(process_num)02d` IS expanded by supervisor (per-worker log file).
;   * The date is resolved when the worker STARTS. A worker that runs
;     continuously across midnight keeps writing into its start-date folder
;     until it is restarted (autorestart / daily restart rolls it to the new
;     day's folder). This matches the old-system behaviour.
;   * `stdout_logfile=/dev/null` because the real logging is the shell redirect
;     above — this just stops supervisor from also keeping its own copy.
;
; Result: storage/logs/2026-07-16/sms_process_queue_00.log, etc. — which is
; exactly the date -> folder -> file layout the admin Logs browser expects.
; ============================================================================


; ============================================================================
; Outbound SMS worker — consumes sms.outbound and SENDS via SMPP.
;
;   --provider=nexmo : bind ONLY Vonage/Nexmo (NOT Sinch). Binding Sinch here
;       collides with sinch:dlr-receiver (Sinch caps at 2 binds/system_id) and
;       floods ESME_RALYBND. Keep Sinch sends off this worker.
;
; REQUIRES in .env:
;   SMS_ASYNC_PUBLISH=true          (API publishes each SMS to sms.outbound)
;   SMPP_SEND_TRANSMITTER_ONLY=true  (send-only bind -> submit_sm_resp captured
;       fast, no DLR-flood starvation). In transmitter mode this worker does NOT
;       receive DLRs, so a DLR path MUST be running:
;         - nexmo:process-delivery-queue (HTTP poll — already defined below), OR
;         - a smpp:dlr-receiver bank (bind_receiver; uses a Vonage bind slot).
;
; PART 3 (horizontal scale): each worker opens its OWN Vonage bind. To run N
;   workers, raise numprocs to N — but ONLY up to the concurrent-bind limit your
;   Vonage account allows (confirm with Vonage; extra binds die on ESME_RALYBND).
;   RabbitMQ auto-balances sms.outbound across all workers — no other change.
; ============================================================================
; DISABLED — replaced by PERSISTENT-TRANSCEIVER mode (SMPP-only DLR, no paid Reports API).
; With SMPP_PERSISTENT_SEND=true the smpp:dlr-receiver banks below drain sms.outbound and SUBMIT on
; their OWN bound session, so Vonage returns each DLR to the SAME session that sent it — no DLR is
; lost to a separate receiver, and no Reports-API backfill is needed. These transmitter-only senders
; MUST stay off, or they would consume sms.outbound and send messages whose DLR never comes back.
[program:sms_process_queue]
command=/bin/bash -c 'LOGDIR=/home/smsexpert/public_html/sms_expert/storage/logs/$(date +%%Y-%%m-%%d); mkdir -p "$LOGDIR"; exec php /home/smsexpert/public_html/sms_expert/artisan sms:process-queue --queue=sms.outbound --provider=nexmo >> "$LOGDIR/sms_process_queue_%(process_num)02d.log" 2>&1'
process_name=%(program_name)s_%(process_num)02d
numprocs=5
autostart=false
autorestart=true
user=www-data
stdout_logfile=/dev/null
stopwaitsecs=30

; ============================================================================
; DLR queue consumer — drains sms.dlr and updates smsg_log.deliverystatus2
; (Delivered / Non Delivered / ...). Each processed DLR is acked = REMOVED from
; the queue on success (same as the outbound worker).
;
; IMPORTANT: this is PURE DB work — it opens NO SMPP bind — so it is NOT limited
; by the Vonage 10-bind cap. Scale numprocs freely (only bounded by CPU/DB, which
; you have plenty of). 3 is ample for this volume; raise if sms.dlr ever backs up.
; ============================================================================
; DISABLED — superseded by [program:dlr_process_buffer] (table-based, no RabbitMQ).
; The DLR flow now is:  SMPP receiver -> smsg_receipt_buffer_new TABLE -> dlr:process-buffer.
; Do NOT run this AND dlr_process_buffer together. Left here (autostart=false) only as a
; fallback for the RabbitMQ path — set DLR_USE_BUFFER=false + autostart=true to revert.
[program:sms_dlr_consume]
command=/bin/bash -c 'LOGDIR=/home/smsexpert/public_html/sms_expert/storage/logs/$(date +%%Y-%%m-%%d); mkdir -p "$LOGDIR"; exec php /home/smsexpert/public_html/sms_expert/artisan dlr:consume --queue=sms.dlr >> "$LOGDIR/sms_dlr_consume_%(process_num)02d.log" 2>&1'
process_name=%(program_name)s_%(process_num)02d
numprocs=3
autostart=false
autorestart=true
user=www-data
stdout_logfile=/dev/null
stopwaitsecs=30

; ============================================================================
; DLR Buffer Processor — OLD-SYSTEM table model (NO RabbitMQ).
; Drains the smsg_receipt_buffer_new TABLE: matches the INDEXED onesixty_suppliermsgref
; and updates smsg_log.deliverystatus2 — the exact daemon_dreceipt_inbound_buffer.php
; flow. The SMPP DLR receivers buffer each DLR (fast insert); THIS worker does the
; match + update + delete.
;
; REQUIRES in .env:  DLR_USE_BUFFER=true  (so the receivers write to the buffer table
; instead of publishing to sms.dlr). Run EXACTLY ONE instance (numprocs=1) — like the
; old single daemon; matching is an indexed seek so one worker clears high volume.
; This is an alternative to sms_dlr_consume above: use ONE path or the other, not both.
; ============================================================================
[program:dlr_process_buffer]
command=/bin/bash -c 'LOGDIR=/home/smsexpert/public_html/sms_expert/storage/logs/$(date +%%Y-%%m-%%d); mkdir -p "$LOGDIR"; exec php /home/smsexpert/public_html/sms_expert/artisan dlr:process-buffer --continuous --limit=200 --sleep=2 >> "$LOGDIR/dlr_process_buffer.log" 2>&1'
numprocs=1
autostart=true
autorestart=true
user=www-data
stdout_logfile=/dev/null
stopwaitsecs=30

