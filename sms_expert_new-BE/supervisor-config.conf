; SMPP-ONLY DLR: this long-running receiver MUST be running for delivery status
; to update. It binds (transceiver) to SMPP_HOST=smpp-eu.vonage.com and processes
; deliver_sm. Update the two paths below to your real deployment path.
[program:smpp-dlr-receiver]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/sms_expert_new-BE/artisan smpp:dlr-receiver --timeout=0
directory=/var/www/sms_expert_new-BE
autostart=true
autorestart=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/supervisor/smpp-dlr-receiver.log
stopwaitsecs=3600
stopsignal=TERM

[program:laravel-scheduler]
process_name=%(program_name)s_%(process_num)02d
command=php /path/to/artisan schedule:run
directory=/path/to/your/project
autostart=true
autorestart=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/supervisor/laravel-scheduler.log
