; =========================================
; Supervisor Configuration for SMS Expert
; =========================================
; Place this file in /etc/supervisor/conf.d/sms-expert.conf
; Then run: supervisorctl reread && supervisorctl update
; =========================================

; =========================================
; Campaign Queue Consumer
; Processes bulk campaign files via RabbitMQ
; =========================================
[program:campaign-consumer]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/sms_expert/artisan campaign:consume
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/sms_expert/storage/logs/campaign-consumer.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
stopwaitsecs=60
startsecs=10
stopsignal=TERM

; =========================================
; Scheduled SMS Processor
; Processes scheduled messages (sentstatus=tomorrowonward)
; =========================================
[program:scheduled-sms-processor]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/sms_expert/artisan sms:process-scheduled --daemon --sleep=30
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/sms_expert/storage/logs/scheduled-sms-processor.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
stopwaitsecs=60
startsecs=10
stopsignal=TERM

; =========================================
; SMS Queue Consumer (SMPP Outbound)
; Processes immediate SMS via RabbitMQ -> SMPP
; Uses existing sms:process-queue command
; =========================================
[program:sms-queue-consumer]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/sms_expert/artisan sms:process-queue --queue=sms.outbound
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=4
redirect_stderr=true
stdout_logfile=/var/www/sms_expert/storage/logs/sms-queue-consumer.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
stopwaitsecs=60
startsecs=10
stopsignal=TERM

; =========================================
; Inbound SMS Queue Consumer
; Processes incoming SMS messages
; =========================================
[program:inbound-sms-consumer]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/sms_expert/artisan queue:inbound-sms
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/sms_expert/storage/logs/inbound-sms-consumer.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
stopwaitsecs=60
startsecs=10
stopsignal=TERM

; =========================================
; Group all SMS workers
; =========================================
[group:sms-workers]
programs=campaign-consumer,scheduled-sms-processor,sms-queue-consumer,inbound-sms-consumer
priority=999
