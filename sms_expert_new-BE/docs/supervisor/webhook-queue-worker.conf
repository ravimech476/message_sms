# Supervisor configuration for Webhook Queue Worker
# Processes DLR and Inbound SMS from RabbitMQ webhook queues
#
# Installation:
#   sudo cp webhook-queue-worker.conf /etc/supervisor/conf.d/
#   sudo supervisorctl reread
#   sudo supervisorctl update
#   sudo supervisorctl start webhook-queue:*

[program:webhook-queue]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/sms_expert_new-BE/artisan queue:webhook --type=all
directory=/var/www/sms_expert_new-BE
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/sms_expert_new-BE/storage/logs/webhook-queue-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stopwaitsecs=3600

# Separate worker for DLR only (higher priority)
[program:webhook-dlr]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/sms_expert_new-BE/artisan queue:webhook --type=dlr
directory=/var/www/sms_expert_new-BE
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/sms_expert_new-BE/storage/logs/webhook-dlr-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stopwaitsecs=3600

# Separate worker for Inbound SMS only
[program:webhook-inbound]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/sms_expert_new-BE/artisan queue:webhook --type=inbound
directory=/var/www/sms_expert_new-BE
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/sms_expert_new-BE/storage/logs/webhook-inbound-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stopwaitsecs=3600

# Group all webhook workers together
[group:webhook-workers]
programs=webhook-queue,webhook-dlr,webhook-inbound
priority=999
