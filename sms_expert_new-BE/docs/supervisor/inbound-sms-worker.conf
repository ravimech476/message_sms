# Inbound SMS Queue Worker - Supervisor Configuration
# 
# This configuration runs the inbound SMS queue processor as a daemon.
# It will process incoming SMS messages from RabbitMQ one by one.
#
# Installation:
# 1. Copy this file to /etc/supervisor/conf.d/inbound-sms-worker.conf
# 2. Run: sudo supervisorctl reread
# 3. Run: sudo supervisorctl update
# 4. Run: sudo supervisorctl start inbound-sms-worker:*
#
# For Windows, use NSSM (Non-Sucking Service Manager) or run manually.

[program:inbound-sms-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /path/to/your/project/artisan queue:inbound-sms
directory=/path/to/your/project
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/path/to/your/project/storage/logs/inbound-sms-worker.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
stopwaitsecs=3600
stopsignal=SIGTERM

# Environment variables (adjust as needed)
environment=
    RABBITMQ_HOST="localhost",
    RABBITMQ_PORT="5672",
    RABBITMQ_USER="guest",
    RABBITMQ_PASSWORD="guest",
    RABBITMQ_VHOST="/",
    RABBITMQ_INBOUND_QUEUE="sms.inbound"
